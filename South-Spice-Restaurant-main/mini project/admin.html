<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Spice Restaurant — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>South Spice Restaurant</h1>
      <nav>
        <a href="index.html" class="nav-link">Order</a>
        <a href="admin.html" class="nav-link active">Admin</a>
      </nav>
    </div>
  </header>

  <main class="admin-layout">
  <p class="staff-note">Staff area — manage menu and view sales reports</p>

  <section class="admin-section">
    <h2>Payment Settings</h2>
    <label for="upi-id">UPI ID for QR payments</label>
    <input type="text" id="upi-id" class="input" placeholder="restaurant@upi">
  </section>

  <section class="admin-section">
    <h2 id="form-title">Add Menu Item</h2>
    <form id="menu-form" class="menu-form">
      <div class="form-row">
        <label for="item-name">Name</label>
        <input type="text" id="item-name" class="input" required placeholder="e.g. Idly">
      </div>
      <div class="form-row">
        <label for="item-price">Price (₹)</label>
        <input type="number" id="item-price" class="input" required min="1" step="1" placeholder="40">
      </div>
      <div class="form-row">
        <label for="item-image">Image path or URL</label>
        <input type="text" id="item-image" class="input" required placeholder="images/idly.svg">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Item</button>
        <button type="button" id="btn-cancel-edit" class="btn btn-outline" style="display:none">Cancel Edit</button>
      </div>
    </form>
  </section>

  <section class="admin-section">
    <h2>Manage Menu</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image Path</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="menu-table-body"></tbody>
      </table>
    </div>
  </section>

  <section class="admin-section">
    <h2>Monthly Sales Report</h2>
    <div class="report-filters">
      <label>
        Year
        <select id="report-year" class="input"></select>
      </label>
      <label>
        Month
        <select id="report-month" class="input">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
      </label>
      <button type="button" id="btn-refresh-report" class="btn btn-secondary">Update Report</button>
    </div>
    <div class="report-summary">
      <div class="summary-card">
        <span class="summary-label">Orders</span>
        <span id="report-orders" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Revenue</span>
        <span id="report-revenue" class="summary-value">₹0.00</span>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Items</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="sales-table-body"></tbody>
      </table>
    </div>
  </section>
  </main>

  <div id="admin-toast" class="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
